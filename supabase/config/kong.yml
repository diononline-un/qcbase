_format_version: "3.0"
_transform: true

services:
  - name: auth
    url: http://auth:9999/verify
    routes:
      - name: auth
        strip_path: true
        paths:
          - /auth/v1
      - name: auth-go
        strip_path: true
        paths:
          - /auth

  - name: rest
    url: http://rest:3000
    routes:
      - name: rest
        strip_path: true
        paths:
          - /rest/v1

  - name: realtime
    url: http://realtime:4000/socket
    routes:
      - name: realtime
        strip_path: true
        paths:
          - /realtime/v1

  - name: storage
    url: http://storage:5000
    routes:
      - name: storage
        strip_path: true
        paths:
          - /storage/v1

  - name: meta
    url: http://meta:8080
    routes:
      - name: meta
        strip_path: true
        paths:
          - /pg
